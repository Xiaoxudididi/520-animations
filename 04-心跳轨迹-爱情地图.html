<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>心跳轨迹·爱情地图</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100vw; height:100vh; height:100dvh;
  overflow:hidden; position:fixed; inset:0;
  background:#0d1117;
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  overscroll-behavior:none;
}

.ecg-panel {
  position:fixed; top:0; left:0; right:0;
  height:clamp(90px, 18vh, 130px);
  z-index:1000; pointer-events:none;
  background:linear-gradient(180deg, rgba(13,17,23,0.98), rgba(13,17,23,0.6), transparent);
  padding-top: env(safe-area-inset-top, 0px);
}
.ecg-canvas { width:100%; height:100%; display:block; }

#mapContainer {
  position:fixed; inset:0; z-index:1;
}

.progress-bar {
  position:fixed; top:clamp(90px, 18vh, 130px); left:12px; right:12px;
  height:3px; z-index:1000; background:rgba(255,255,255,0.08);
  border-radius:2px; overflow:hidden;
}
.progress-fill {
  height:100%; background:linear-gradient(90deg, #e74c3c, #ff6b9d);
  border-radius:2px; transition:width 0.8s ease; width:0%;
}

.info-card {
  position:fixed; bottom:clamp(140px, 22vh, 180px); left:50%; transform:translateX(-50%);
  background:rgba(13,17,23,0.92);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:20px; padding:0;
  color:#fff; z-index:1000; text-align:center;
  backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px);
  min-width:clamp(280px, 75vw, 340px); max-width:88vw;
  transition:all 0.6s cubic-bezier(0.175,0.885,0.32,1.275);
  overflow:hidden;
}
.info-card .location-image {
  width:100%; height:clamp(120px, 25vw, 160px);
  object-fit:cover; display:block;
  transition:opacity 0.6s ease;
  background:#1a1f2e;
}
.info-card .card-content {
  padding:clamp(12px, 3vw, 16px) clamp(18px, 5vw, 24px);
}
.info-card .location-name {
  font-size:clamp(16px, 4.5vw, 20px);
  font-weight:bold; margin-bottom:4px; letter-spacing:2px;
}
.info-card .location-date {
  font-size:clamp(11px, 3vw, 13px);
  color:rgba(255,255,255,0.55); margin-bottom:8px;
}
.info-card .location-desc {
  font-size:clamp(12px, 3.2vw, 14px);
  color:rgba(255,255,255,0.75); line-height:1.6;
}

.footer-text {
  position:fixed; bottom:clamp(10px, 2vh, 20px); width:100%;
  text-align:center; z-index:1000;
  color:rgba(255,255,255,0.35); font-size:clamp(10px, 2.5vw, 12px);
  letter-spacing:2px; pointer-events:none;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
}

.music-player {
  position:fixed; bottom:clamp(10px, 2vh, 20px); left:50%; transform:translateX(-50%);
  background:rgba(13,17,23,0.95);
  border:1px solid rgba(255,100,100,0.3);
  border-radius:40px; padding:8px 16px;
  z-index:1050;
  display:flex; align-items:center; gap:12px;
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  transition:all 0.3s ease;
  min-width:clamp(200px, 50vw, 280px);
}
.music-player:hover {
  transform:translateX(-50%) scale(1.02);
  border-color:rgba(255,100,100,0.5);
}
.music-player .album-cover {
  width:44px; height:44px; border-radius:50%;
  background:linear-gradient(135deg, #ff6b9d, #c44569);
  display:flex; align-items:center; justify-content:center;
  font-size:20px;
  animation:albumRotate 8s linear infinite;
  animation-play-state:paused;
}
.music-player.playing .album-cover {
  animation-play-state:running;
}
@keyframes albumRotate {
  from { transform:rotate(0deg); }
  to { transform:rotate(360deg); }
}
.music-player .music-info {
  flex:1; min-width:0;
}
.music-player .music-title {
  font-size:13px; color:#fff; font-weight:500;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.music-player .music-artist {
  font-size:11px; color:rgba(255,255,255,0.5);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.music-player .control-btn {
  width:32px; height:32px; border-radius:50%;
  background:rgba(255,255,255,0.1);
  border:none; outline:none;
  color:#fff; font-size:14px;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s ease;
}
.music-player .control-btn:hover {
  background:rgba(255,100,100,0.5);
  transform:scale(1.1);
}
.music-player .control-btn.play {
  width:38px; height:38px;
  background:linear-gradient(135deg, #ff6b9d, #e74c3c);
}
.music-player .progress-bar {
  position:absolute; bottom:-4px; left:50%; transform:translateX(-50%);
  width:80%; height:2px; background:rgba(255,255,255,0.2);
  border-radius:1px; overflow:hidden;
}
.music-player .progress-fill {
  height:100%; background:linear-gradient(90deg, #ff6b9d, #e74c3c);
  border-radius:1px; transition:width 0.3s linear;
}

.final-confession {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0);
  background:rgba(0,0,0,0.88); border:2px solid rgba(255,100,100,0.45);
  border-radius:22px; padding:clamp(24px, 6vw, 32px); color:#fff;
  z-index:2000; text-align:center;
  font-size:clamp(18px, 5vw, 24px); letter-spacing:3px;
  transition:transform 0.6s cubic-bezier(0.175,0.885,0.32,1.275);
  backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px);
  pointer-events:none; max-width:85vw; line-height:1.7;
}
.final-confession.show { transform:translate(-50%,-50%) scale(1); }
.final-confession .heart-icon {
  font-size:clamp(40px, 12vw, 52px); display:block; margin-bottom:8px;
  animation:pulse 1s infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }

.leaflet-control-zoom { display:none; }
.love-popup .leaflet-popup-content-wrapper {
  background:rgba(13,17,23,0.9); color:#fff; border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
}
.love-popup .leaflet-popup-tip { background:rgba(13,17,23,0.9); }
</style>
</head>
<body>

<div class="ecg-panel">
  <canvas class="ecg-canvas" id="ecgCanvas"></canvas>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div id="mapContainer"></div>

<div class="info-card" id="infoCard">
  <img class="location-image" id="locImage" src="" alt="" style="display:none;">
  <div class="card-content">
    <div class="location-name" id="locName">准备开始...</div>
    <div class="location-date" id="locDate"></div>
    <div class="location-desc" id="locDesc"></div>
  </div>
</div>

<div class="footer-text" id="footerText"></div>

<div class="music-player" id="musicPlayer">
  <div class="album-cover">🎵</div>
  <div class="music-info">
    <div class="music-title">告白气球</div>
    <div class="music-artist">周杰伦</div>
  </div>
  <button class="control-btn" id="prevBtn">⏮</button>
  <button class="control-btn play" id="playBtn">▶</button>
  <button class="control-btn" id="nextBtn">⏭</button>
  <div class="progress-bar">
    <div class="progress-fill" id="musicProgress"></div>
  </div>
</div>

<audio id="musicAudio" loop autoplay muted>
  <source src="告白气球-周杰伦.mp3" type="audio/mpeg">
</audio>

<div class="final-confession" id="finalConfession">
  <span class="heart-icon">💝</span>
  <span id="finalText"></span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function() {
  var ANTI_RESALE_CODE = 'XF5201314';
  var _n1 = 'XF';
  var _n2 = '小仙女';
  var ANTI_RESALE_NAMES = _n1 + '和' + _n2;

  function deriveSeed(c) {
    var s = 0; for (var i = 0; i < c.length; i++) s += c.charCodeAt(i);
    return s;
  }
  var SEED = deriveSeed(ANTI_RESALE_CODE);

  var MARKER_COLORS = [];
  for (var ci = 0; ci < 4; ci++) {
    var h = (ANTI_RESALE_CODE.charCodeAt(ci % ANTI_RESALE_CODE.length) * 13 + ci * 47) % 360;
    MARKER_COLORS.push('hsl(' + h + ',70%,55%)');
  }

  var locations = [
    { lat: 31.2304, lng: 121.4737, name: '相遇 · 上海外滩' },
    { lat: 30.2741, lng: 120.1551, name: '第一次约会 · 西湖断桥' },
    { lat: 39.9042, lng: 116.4074, name: '确定关系 · 北京故宫' },
    { lat: 30.2741, lng: 120.1551, name: '订婚 · 杭州西湖' }
  ];

  var locationDetails = [
    { date: '2023年3月15日', desc: '在人海中遇见了你，从此世界变得不同', 
      image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600&h=300&fit=crop' },
    { date: '2023年6月21日', desc: '西湖边的第一次约会，你说喜欢夏天的风', 
      image: 'https://images.unsplash.com/photo-1534244484873-6069ad146140?w=600&h=300&fit=crop' },
    { date: '2023年12月25日', desc: '圣诞节的雪夜里，我们确定了彼此的心意', 
      image: 'https://images.unsplash.com/photo-1487088678257-3a541e6e3922?w=600&h=300&fit=crop' },
    { date: '2024年5月20日', desc: '在西湖畔，我单膝跪地，许下一生的承诺', 
      image: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&h=300&fit=crop' }
  ];

  var heartbeatSpeed = 3;
  var mapStyle = 'standard';
  var finalMessage = '走过千山万水，最想去的地方，是你的心里';

  var mapContainer = document.getElementById('mapContainer');

  var tileUrls = {
    standard: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    satellite: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    night: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
  };
  var tileAttributions = {
    standard: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    satellite: '&copy; Esri',
    night: '&copy; <a href="https://carto.com/">CARTO</a>'
  };

  var map = L.map(mapContainer, {
    center: [locations[0].lat, locations[0].lng],
    zoom: 5,
    zoomControl: false,
    attributionControl: false,
    dragging: true,
    tap: true
  });

  L.tileLayer(tileUrls[mapStyle] || tileUrls.standard, {
    attribution: tileAttributions[mapStyle] || tileAttributions.standard,
    maxZoom: 18
  }).addTo(map);

  setTimeout(function() { map.invalidateSize(); }, 600);

  var ecgCanvas = document.getElementById('ecgCanvas');
  var ecgCtx = ecgCanvas.getContext('2d');
  var ecgW, ecgH;

  function resizeECG() {
    ecgW = ecgCanvas.width = ecgCanvas.parentElement.clientWidth;
    ecgH = ecgCanvas.height = ecgCanvas.parentElement.clientHeight;
  }
  resizeECG();
  window.addEventListener('resize', resizeECG);

  var ecgColorHue = (ANTI_RESALE_CODE.charCodeAt(0) * 7 + ANTI_RESALE_CODE.charCodeAt(3) * 13) % 360;
  var ecgPhase = 0;
  var speedMap = { 1:0.025, 2:0.04, 3:0.06, 4:0.08, 5:0.12 };
  var ecgSpeed = speedMap[heartbeatSpeed] || 0.06;

  function drawECG() {
    ecgCtx.clearRect(0, 0, ecgW, ecgH);

    ecgCtx.strokeStyle = 'rgba(255,255,255,0.03)';
    ecgCtx.lineWidth = 0.5;
    for (var gy = 0; gy < ecgH; gy += 20) {
      ecgCtx.beginPath(); ecgCtx.moveTo(0, gy); ecgCtx.lineTo(ecgW, gy); ecgCtx.stroke();
    }
    for (var gx = 0; gx < ecgW; gx += 40) {
      ecgCtx.beginPath(); ecgCtx.moveTo(gx, 0); ecgCtx.lineTo(gx, ecgH); ecgCtx.stroke();
    }

    ecgCtx.strokeStyle = 'hsl(' + ecgColorHue + ',80%,55%)';
    ecgCtx.lineWidth = 2;
    ecgCtx.shadowColor = 'hsl(' + ecgColorHue + ',80%,55%)';
    ecgCtx.shadowBlur = 8;
    ecgCtx.beginPath();

    var midY = ecgH / 2;
    for (var x = 0; x < ecgW; x++) {
      var t = (x / ecgW) * 4 * Math.PI + ecgPhase;
      var y = midY;
      var wavePhase = t % (2 * Math.PI);

      if (wavePhase < 0.15) {
        y = midY - 35 * Math.sin(wavePhase / 0.15 * Math.PI);
      } else if (wavePhase < 0.3) {
        y = midY + 22 * Math.sin((wavePhase - 0.15) / 0.15 * Math.PI);
      } else if (wavePhase < 0.45) {
        y = midY - 12 * Math.sin((wavePhase - 0.3) / 0.15 * Math.PI);
      } else {
        y = midY + Math.sin(t) * 2.5;
      }

      if (x === 0) ecgCtx.moveTo(x, y);
      else ecgCtx.lineTo(x, y);
    }
    ecgCtx.stroke();
    ecgCtx.shadowBlur = 0;

    ecgPhase += ecgSpeed;
    requestAnimationFrame(drawECG);
  }
  drawECG();

  var locNameEl = document.getElementById('locName');
  var locDateEl = document.getElementById('locDate');
  var locDescEl = document.getElementById('locDesc');
  var locImageEl = document.getElementById('locImage');
  var progressFill = document.getElementById('progressFill');
  var finalConfession = document.getElementById('finalConfession');
  var finalTextEl = document.getElementById('finalText');
  var currentLocation = 0;
  var allMarkers = [];

  function showLocation(index) {
    if (index >= locations.length) {
      progressFill.style.width = '100%';
      setTimeout(showFinalConfession, 1500);
      return;
    }

    var loc = locations[index];
    var detail = locationDetails[index];

    map.flyTo([loc.lat, loc.lng], 13, { duration: 2 });

    var markerColor = MARKER_COLORS[index];
    var markerIcon = L.divIcon({
      className: 'custom-marker',
      html: '<div style="width:22px;height:22px;background:' + markerColor +
            ';border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 15px ' + markerColor +
            ';animation:markerPulse 1.5s infinite;"></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });

    var marker = L.marker([loc.lat, loc.lng], { icon: markerIcon }).addTo(map);

    setTimeout(function() {
      marker.bindPopup(
        '<div style="max-width:200px;"><b>' + loc.name + '</b><br>' + detail.date + '<br>' + detail.desc + '</div>',
        { closeButton: false, className: 'love-popup', maxWidth: 220 }
      ).openPopup();
    }, 2000);

    allMarkers.push(marker);
    
    if (detail.image) {
      locImageEl.style.opacity = '0';
      locImageEl.src = detail.image;
      locImageEl.style.display = 'block';
      locImageEl.onload = function() {
        locImageEl.style.opacity = '1';
      };
      locImageEl.onerror = function() {
        locImageEl.src = 'https://via.placeholder.com/600x300/1a1f2e/ffffff?text=❤️';
        locImageEl.style.opacity = '1';
      };
    } else {
      locImageEl.style.display = 'none';
    }
    
    locNameEl.textContent = loc.name;
    locDateEl.textContent = detail.date;
    locDescEl.textContent = detail.desc;
    progressFill.style.width = ((index + 1) / locations.length * 100) + '%';

    currentLocation++;
    setTimeout(function() { showLocation(currentLocation); }, 7000);
  }

  function showFinalConfession() {
    finalTextEl.textContent = finalMessage;
    finalConfession.classList.add('show');

    var center = map.getCenter();
    var heartIcon = L.divIcon({
      className: 'heart-icon',
      html: '<div style="font-size:44px;animation:pulse 1.5s infinite;filter:drop-shadow(0 0 20px rgba(255,100,100,0.8));">💖</div>',
      iconSize: [44, 44],
      iconAnchor: [22, 22]
    });
    L.marker([center.lat, center.lng], { icon: heartIcon }).addTo(map);

    var heartCoords = [];
    var scale = 0.03;
    for (var t = 0; t < Math.PI * 2; t += 0.1) {
      var x = 16 * Math.pow(Math.sin(t), 3);
      var y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      heartCoords.push([center.lat + y * scale, center.lng + x * scale]);
    }
    L.polyline(heartCoords, {
      color: 'hsl(' + ecgColorHue + ',80%,55%)',
      weight: 3, opacity: 0.7, dashArray: '5, 5'
    }).addTo(map);
  }

  var _p1 = '为';
  var _p2 = ANTI_RESALE_NAMES;
  var _p3 = '专属制作';
  var _p4 = ' | 定制编号：' + ANTI_RESALE_CODE;
  document.getElementById('footerText').textContent = _p1 + _p2 + _p3 + _p4;

  setTimeout(function() { showLocation(0); }, 1500);

  window.addEventListener('resize', function() {
    resizeECG();
    setTimeout(function() { map.invalidateSize(); }, 300);
  });
  window.addEventListener('orientationchange', function() {
    setTimeout(function() { map.invalidateSize(); }, 500);
  });

  var styleEl = document.createElement('style');
  styleEl.textContent = '@keyframes markerPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:0.6}}';
  document.head.appendChild(styleEl);

  var musicPlayer = document.getElementById('musicPlayer');
  var musicAudio = document.getElementById('musicAudio');
  var playBtn = document.getElementById('playBtn');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var musicProgress = document.getElementById('musicProgress');

  musicAudio.volume = 0.5;

  musicAudio.addEventListener('play', function() {
    musicAudio.muted = false;
    playBtn.innerHTML = '⏸';
    musicPlayer.classList.add('playing');
  });

  playBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (musicAudio.paused) {
      musicAudio.play().catch(function() {});
      playBtn.innerHTML = '⏸';
      musicPlayer.classList.add('playing');
    } else {
      musicAudio.pause();
      playBtn.innerHTML = '▶';
      musicPlayer.classList.remove('playing');
    }
  });

  prevBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    musicAudio.currentTime = 0;
  });

  nextBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    musicAudio.currentTime = 0;
    musicAudio.play().catch(function() {});
    playBtn.innerHTML = '⏸';
    musicPlayer.classList.add('playing');
  });

  musicAudio.addEventListener('timeupdate', function() {
    var duration = musicAudio.duration;
    var currentTime = musicAudio.currentTime;
    if (duration > 0) {
      musicProgress.style.width = (currentTime / duration * 100) + '%';
    }
  });

  musicAudio.addEventListener('ended', function() {
    playBtn.innerHTML = '▶';
    musicPlayer.classList.remove('playing');
  });

  document.addEventListener('click', function(e) {
    if (musicAudio.paused && e.target.id !== 'playBtn' && e.target.id !== 'prevBtn' && e.target.id !== 'nextBtn') {
      musicAudio.play().catch(function() {});
      playBtn.innerHTML = '⏸';
      musicPlayer.classList.add('playing');
    }
  });
})();
</script>
</body>
</html>
