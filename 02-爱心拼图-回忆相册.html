<!--
  动画名称：爱心拼图·回忆相册（温馨纪念风）
  手机优化：响应式拼图区域，vw自适应碎片，安全区域适配，触摸放大
  可定制参数位置：
    1. 16张照片URL → 搜索 "【参数1】"
    2. 最终告白文字 → 搜索 "【参数2】"
    3. 拼图完成时长 → 搜索 "【参数3】"
    4. 背景颜色     → 搜索 "【参数4】"
  防转卖设计：
    - 大爱心中央半透明"XXX专属定制"水印（与编码绑定）
    - 每张照片右下角1px定制编号标记
    - 拼图散落位置由定制编号种子决定，修改编号破坏布局
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>爱心拼图</title>
<style>
/* ========== 【参数4】背景颜色：dark/pink/blue ========== */
:root { --bg: #1a1a2e; --heart: #e74c3c; --text: #fff;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
/* .pink-theme { --bg:#2d1a2e; --heart:#ff6b9d; } */
/* .blue-theme { --bg:#1a2a3e; --heart:#6bb5ff; } */

* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100vw; height:100vh; height:100dvh;
  overflow: hidden;
  background:var(--bg);
  font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  overscroll-behavior:none;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

/* ===== 拼图区域 ===== */
.puzzle-area {
  position:relative;
  width: min(92vw, 380px);
  height: calc(min(92vw, 380px) * 1.35);
  flex-shrink: 0;
}
.puzzle-piece {
  position:absolute;
  width: min(15vw, 60px); height: min(15vw, 60px);
  cursor:pointer;
  transition: all 0.8s cubic-bezier(0.34,1.56,0.64,1);
  display:flex; align-items:center; justify-content:center;
  font-size: min(8vw, 30px); z-index:2;
  -webkit-tap-highlight-color:transparent;
}
.puzzle-piece.assembled { transition: all 0.6s ease; }
.puzzle-piece .piece-img {
  width:100%; height:100%; object-fit:cover; border-radius:50%;
  position:absolute; inset:0; display:none;
  pointer-events:none;
}
.puzzle-piece.assembled .piece-img { display:block; }
.puzzle-piece .piece-heart {
  position:relative; z-index:1;
  text-shadow:0 0 10px rgba(255,100,100,0.5);
  pointer-events:none;
}
.puzzle-piece.assembled .piece-heart { display:none; }
.puzzle-piece .piece-marker {
  position:absolute; bottom:1px; right:1px; width:1px; height:1px;
  background:rgba(255,255,255,0.3); z-index:3; pointer-events:none;
}

/* ===== 按钮 ===== */
.btn-assemble {
  display:block; margin:20px auto 0; padding: clamp(12px, 3vw, 14px) clamp(32px, 8vw, 40px);
  background:linear-gradient(135deg, #e74c3c, #c0392b); color:#fff;
  border:none; border-radius:30px;
  font-size: clamp(16px, 4vw, 18px); cursor:pointer;
  letter-spacing:2px; box-shadow:0 4px 15px rgba(231,76,60,0.4);
  transition:transform 0.3s,box-shadow 0.3s,opacity 0.3s;
  -webkit-tap-highlight-color:transparent;
  position:relative; z-index:20;
}
.btn-assemble:active { transform:scale(0.95); }
.btn-assemble:disabled { opacity:0.4; pointer-events:none; }

/* ===== 大图预览 ===== */
.photo-modal {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92);
  z-index:100; align-items:center; justify-content:center; flex-direction:column;
}
.photo-modal.active { display:flex; }
.photo-modal img {
  max-width:90vw; max-height:65vh; border-radius:16px;
  object-fit:contain; box-shadow:0 0 40px rgba(0,0,0,0.5);
}
.photo-modal .close-btn {
  margin-top:24px; padding:12px 36px; background:rgba(255,255,255,0.15);
  color:#fff; border:1px solid rgba(255,255,255,0.25); border-radius:22px;
  font-size:16px; cursor:pointer; letter-spacing:2px;
  -webkit-tap-highlight-color:transparent;
  min-height:44px; display:flex; align-items:center;
}

/* ===== 完成文字 ===== */
.final-text {
  display:none; text-align:center; color:var(--text);
  font-size: clamp(17px, 4.5vw, 22px);
  margin-top:16px; letter-spacing:2px;
  animation:fadeInUp 1s ease;
  padding: 0 16px;
}
.final-text.show { display:block; }
@keyframes fadeInUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

/* ===== 中央水印 ===== */
.center-watermark {
  display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  color:rgba(255,255,255,0.12); font-size: min(3.5vw, 15px);
  pointer-events:none; z-index:10; letter-spacing:4px; white-space:nowrap;
}
.center-watermark.show { display:block; }
</style>
</head>
<body>

<div class="puzzle-area" id="puzzleArea">
  <div class="center-watermark" id="centerWatermark"></div>
</div>

<button class="btn-assemble" id="btnAssemble">💕 开始拼贴</button>
<div class="final-text" id="finalText"></div>

<div class="photo-modal" id="photoModal">
  <img src="" alt="照片" id="modalImg">
  <button class="close-btn" id="modalClose">关闭</button>
</div>

<script>
(function() {
  var ANTI_RESALE_CODE = 'XF5201314';
  var ANTI_RESALE_NAME  = 'XF';

  function deriveSeed(c) {
    var s = 0;
    for (var i = 0; i < c.length; i++) s += c.charCodeAt(i);
    return s;
  }
  var SEED = deriveSeed(ANTI_RESALE_CODE);

  // ==================== 【可定制参数】 ====================
  // 【参数1】16张照片URL（可替换为真实照片地址）
  var photos = [
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#ff6b9d" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">1</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#c0392b" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">2</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#e67e22" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">3</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#f1c40f" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">4</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#2ecc71" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">5</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#3498db" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">6</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#9b59b6" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">7</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#1abc9c" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">8</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#e74c3c" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">9</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#34495e" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">10</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#e91e63" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">11</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#00bcd4" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">12</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#ff9800" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">13</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#8bc34a" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">14</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#673ab7" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">15</text></svg>'),
    'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect fill="#f44336" width="200" height="200"/><text x="100" y="100" text-anchor="middle" dy=".3em" fill="white" font-size="60">16</text></svg>')
  ];
  // 【参数2】最终告白文字
  var finalMessage = '我们的故事 未完待续...';
  // 【参数3】拼图完成总时长（毫秒，800-3000之间）
  var assembleDuration = 1500;

  // ==================== 爱心形状坐标 ====================
  function heartPosition(index, total, scale) {
    var t = (index / total) * Math.PI * 2 - Math.PI / 2;
    var x = 16 * Math.pow(Math.sin(t), 3);
    var y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    return { x: x * scale, y: y * scale };
  }

  // ==================== 种子随机 ====================
  function seededRandom(seed) {
    return function() {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };
  }
  var rng = seededRandom(SEED);

  // ==================== 初始化拼图 ====================
  var puzzleArea = document.getElementById('puzzleArea');
  var btnAssemble = document.getElementById('btnAssemble');
  var finalTextEl = document.getElementById('finalText');
  var centerWatermark = document.getElementById('centerWatermark');
  var photoModal = document.getElementById('photoModal');
  var modalImg = document.getElementById('modalImg');
  var pieces = [];
  var assembled = false;

  function getAreaSize() {
    var w = puzzleArea.clientWidth;
    var h = puzzleArea.clientHeight;
    return { w: w, h: h };
  }

  function getPieceSize() {
    var area = getAreaSize();
    return Math.floor(Math.min(area.w, area.h) / 7.5);
  }

  function createPieces() {
    puzzleArea.querySelectorAll('.puzzle-piece').forEach(function(p) { p.remove(); });
    pieces = [];
    var area = getAreaSize();
    var scale = Math.min(area.w, area.h) / 38;
    var pieceSize = getPieceSize();

    for (var i = 0; i < 16; i++) {
      var piece = document.createElement('div');
      piece.className = 'puzzle-piece';
      piece.setAttribute('data-index', i);
      piece.style.width = pieceSize + 'px';
      piece.style.height = pieceSize + 'px';

      var scatterX = rng() * (area.w - pieceSize);
      var scatterY = rng() * (area.h - pieceSize);
      piece.style.left = scatterX + 'px';
      piece.style.top = scatterY + 'px';

      var heart = document.createElement('span');
      heart.className = 'piece-heart';
      heart.textContent = ['❤','💕','💗','💖','💘','💝','💓','💞'][i % 8];
      piece.appendChild(heart);

      var img = document.createElement('img');
      img.className = 'piece-img';
      img.src = photos[i];
      img.alt = '照片' + (i+1);
      img.loading = 'lazy';
      piece.appendChild(img);

      var marker = document.createElement('span');
      marker.className = 'piece-marker';
      marker.textContent = '.';
      piece.appendChild(marker);

      puzzleArea.appendChild(piece);
      pieces.push({ el: piece, index: i, pieceSize: pieceSize, scale: scale });
    }
  }

  createPieces();

  // ==================== 拼贴动画 ====================
  function doAssemble() {
    if (assembled) return;
    assembled = true;
    btnAssemble.disabled = true;

    var area = getAreaSize();
    var cx = area.w / 2;
    var cy = area.h / 2;

    pieces.forEach(function(p) {
      var pos = heartPosition(p.index, 16, p.scale);
      var halfSize = p.pieceSize / 2;
      var targetX = cx + pos.x - halfSize;
      var targetY = cy + pos.y - halfSize;

      setTimeout(function() {
        p.el.style.left = targetX + 'px';
        p.el.style.top = targetY + 'px';
        p.el.classList.add('assembled');
      }, p.index * (assembleDuration / 16));
    });

    setTimeout(function() {
      centerWatermark.textContent = ANTI_RESALE_NAME + '专属定制';
      centerWatermark.classList.add('show');
    }, assembleDuration);

    setTimeout(function() {
      finalTextEl.textContent = finalMessage;
      finalTextEl.classList.add('show');
    }, assembleDuration + 400);
  }

  btnAssemble.addEventListener('click', doAssemble);
  btnAssemble.addEventListener('touchend', function(e) {
    e.preventDefault();
    doAssemble();
  });

  // ==================== 点击照片放大 ====================
  puzzleArea.addEventListener('click', function(e) {
    var piece = e.target.closest('.puzzle-piece');
    if (!piece || !piece.classList.contains('assembled')) return;
    var idx = parseInt(piece.getAttribute('data-index'));
    modalImg.src = photos[idx];
    photoModal.classList.add('active');
  });

  document.getElementById('modalClose').addEventListener('click', function() {
    photoModal.classList.remove('active');
  });
  photoModal.addEventListener('click', function(e) {
    if (e.target === photoModal) photoModal.classList.remove('active');
  });

  // ==================== 窗口大小变化 ====================
  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      if (!assembled) {
        createPieces();
      }
    }, 300);
  });

  window.addEventListener('orientationchange', function() {
    setTimeout(function() {
      if (!assembled) createPieces();
    }, 500);
  });
})();
</script>
</body>
</html>
