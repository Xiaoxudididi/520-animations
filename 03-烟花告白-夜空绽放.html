<!--
  动画名称：烟花告白·夜空绽放（浪漫氛围感）
  手机优化：满屏Canvas，vw单位文字，触摸绽放，安全区域适配
  可定制参数位置：
    1. 告白语       → 搜索 "【参数1】"
    2. 烟花主色调   → 搜索 "【参数2】"
    3. 背景音乐URL  → 搜索 "【参数3】"
    4. 结尾祝福文字 → 搜索 "【参数4】"
  防转卖设计：
    - 烟花颜色组合与绽放顺序由6位定制编号唯一决定
    - 最后爱心烟花雨中随机出现客户名字缩写的小爱心
    - Canvas像素中嵌入编码印记
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>烟花告白</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100vw; height:100vh; height:100dvh;
  overflow:hidden; position:fixed; inset:0;
  background:#000;
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  touch-action:none; overscroll-behavior:none;
}
canvas {
  display:block; position:fixed; top:0; left:0;
  width:100%; height:100%;
}

/* ===== 告白文字层 ===== */
.reveal-layer {
  position:fixed; top:38%; left:50%; transform:translate(-50%,-50%);
  pointer-events:none; z-index:10; white-space:nowrap;
}
.reveal-char {
  display:inline-block;
  font-size: clamp(36px, 10vw, 56px);
  color:#fff;
  text-shadow:0 0 30px rgba(255,255,255,0.8),0 0 60px rgba(255,200,100,0.6);
  opacity:0; transform:scale(0);
  transition:all 0.6s cubic-bezier(0.175,0.885,0.32,1.275);
  margin:0 1px;
}
.reveal-char.show { opacity:1; transform:scale(1); }

/* ===== 提示 ===== */
.hint-text {
  position:fixed; bottom:clamp(50px, 12vh, 80px); width:100%; text-align:center;
  color:rgba(255,255,255,0.6); font-size:clamp(13px, 3.5vw, 15px);
  pointer-events:none; z-index:10; letter-spacing:2px;
  padding: 0 16px;
}
.hint-text.done { animation:fadeOut 2s forwards; }
@keyframes fadeOut { to{opacity:0;} }

/* ===== 结尾祝福 ===== */
.blessing {
  position:fixed; top:35%; left:50%; transform:translate(-50%,-50%);
  color:#fff; font-size:clamp(20px, 5.5vw, 28px);
  text-align:center; z-index:11; pointer-events:none;
  opacity:0; transition:opacity 1.5s;
  text-shadow:0 0 20px rgba(255,200,100,0.8);
  padding: 0 20px; line-height: 1.6;
}
.blessing.show { opacity:1; }

/* ===== 音乐按钮 ===== */
.music-btn {
  position:fixed; top:clamp(12px, 4vw, 20px); right:clamp(12px, 4vw, 20px); z-index:20;
  width:clamp(38px, 10vw, 44px); height:clamp(38px, 10vw, 44px);
  border-radius:50%; background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.25); color:#fff;
  font-size:clamp(16px, 4.5vw, 20px); cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent;
  transition:background 0.3s;
}
.music-btn:active { background:rgba(255,255,255,0.25); }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="reveal-layer" id="revealLayer"></div>
<div class="hint-text" id="hintText">✨ 轻触夜空，绽放你的告白 ✨</div>
<div class="blessing" id="blessing"></div>
<button class="music-btn" id="musicBtn" title="音乐">🎵</button>

<script>
(function() {
  var ANTI_RESALE_CODE = 'XF5201314';
  var ANTI_RESALE_NAME  = 'XF';

  function deriveSeed(c) {
    var s = 0; for (var i = 0; i < c.length; i++) s += c.charCodeAt(i);
    return s;
  }
  var SEED = deriveSeed(ANTI_RESALE_CODE);

  function codeToColors(code) {
    var colors = [];
    var baseHues = [0, 30, 330, 280, 200, 340, 20, 350, 290, 50];
    for (var i = 0; i < code.length; i++) {
      var hue = (baseHues[i % baseHues.length] + code.charCodeAt(i) * 3) % 360;
      colors.push(hue);
    }
    return colors;
  }
  var CODE_COLORS = codeToColors(ANTI_RESALE_CODE);

  // ==================== 【可定制参数】 ====================
  // 【参数1】告白语（最多10个字）
  var confessionText = '我爱你一生一世';
  // 【参数2】烟花主色调：pink(粉色)/red(红色)/purple(紫色)/blue(蓝色)
  var mainHue = 'pink';
  // 【参数3】背景音乐URL（留空则不播放）
  var musicUrl = '';
  // 【参数4】结尾祝福文字
  var blessingText = '愿每个夜晚都有烟花为你绽放 ❤';

  var hueMap = { pink: 340, red: 0, purple: 280, blue: 210 };
  var BASE_HUE = hueMap[mainHue] || 340;

  // ==================== Canvas初始化 ====================
  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function() {
    setTimeout(resize, 300);
  });

  // ==================== 星星 ====================
  var stars = [];
  for (var i = 0; i < 120; i++) {
    stars.push({
      x: Math.random() * 2000,
      y: Math.random() * 2000,
      r: Math.random() * 1.5 + 0.4,
      twinkle: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.02 + 0.008
    });
  }

  // ==================== 粒子系统 ====================
  var particles = [];

  function Particle(x, y, color, type) {
    this.x = x; this.y = y;
    var angle = Math.random() * Math.PI * 2;
    var speed = Math.random() * 5 + 1.2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.color = color;
    this.alpha = 1;
    this.decay = Math.random() * 0.018 + 0.007;
    this.size = Math.random() * 2.5 + 1;
    this.gravity = 0.04;
    this.type = type || 'circle';
  }

  Particle.prototype.update = function() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += this.gravity;
    this.vx *= 0.99;
    this.alpha -= this.decay;
  };

  Particle.prototype.draw = function(ctx) {
    if (this.alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;

    if (this.type === 'heart') {
      var s = this.size * 1.4;
      ctx.translate(this.x, this.y);
      ctx.beginPath();
      var sx = s / 8;
      ctx.moveTo(0, s * 0.3);
      ctx.bezierCurveTo(-sx, s*0.1, -sx, -s*0.4, 0, -s*0.1);
      ctx.bezierCurveTo(sx, -s*0.4, sx, s*0.1, 0, s*0.3);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  };

  function explodeFirework(x, y, hue) {
    var count = 70 + Math.floor(Math.random() * 30);
    for (var i = 0; i < count; i++) {
      var h = hue + (Math.random() - 0.5) * 40;
      var s = 80 + Math.random() * 20;
      var l = 50 + Math.random() * 30;
      var color = 'hsl(' + h + ',' + s + '%,' + l + '%)';
      particles.push(new Particle(x, y, color, 'circle'));
    }
    for (var j = 0; j < 12; j++) {
      particles.push(new Particle(x, y, 'rgba(255,255,255,0.9)', 'circle'));
    }
  }

  function explodeHeartFirework(x, y, hue) {
    var count = 25;
    for (var i = 0; i < count; i++) {
      var h = hue + (Math.random() - 0.5) * 20;
      var color = 'hsl(' + h + ',90%,60%)';
      var p = new Particle(x, y, color, 'heart');
      p.size = Math.random() * 4 + 2.5;
      p.decay = Math.random() * 0.012 + 0.004;
      particles.push(p);
    }
  }

  // ==================== 告白文字管理 ====================
  var revealLayer = document.getElementById('revealLayer');
  var hintText = document.getElementById('hintText');
  var blessingEl = document.getElementById('blessing');
  var chars = confessionText.split('');
  var clickCount = 0;
  var allDone = false;

  chars.forEach(function(ch, i) {
    var span = document.createElement('span');
    span.className = 'reveal-char';
    span.setAttribute('data-index', i);
    span.textContent = ch;
    revealLayer.appendChild(span);
  });

  function revealChar(index) {
    var span = revealLayer.querySelector('[data-index="' + index + '"]');
    if (span) span.classList.add('show');
  }

  // ==================== 点击处理 ====================
  function handleFirework(clientX, clientY) {
    if (allDone) return;
    initAudio();

    var x = clientX || W/2;
    var y = clientY || H * 0.35;
    var hue = CODE_COLORS[clickCount % CODE_COLORS.length];

    explodeFirework(x, y, hue);
    revealChar(clickCount);
    clickCount++;

    if (clickCount >= chars.length) {
      allDone = true;
      hintText.classList.add('done');

      setTimeout(function() { launchHeartRain(); }, 1000);
      setTimeout(function() {
        blessingEl.textContent = blessingText;
        blessingEl.classList.add('show');
      }, 2000);
    } else {
      hintText.textContent = '已绽放 ' + clickCount + '/' + chars.length + ' 朵烟花';
    }
  }

  canvas.addEventListener('click', function(e) {
    handleFirework(e.clientX, e.clientY);
  });
  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    var touch = e.changedTouches[0];
    if (touch) handleFirework(touch.clientX, touch.clientY);
  });

  function launchHeartRain() {
    var count = 0;
    var maxHearts = 22;
    var interval = setInterval(function() {
      if (count >= maxHearts) { clearInterval(interval); return; }

      var x = Math.random() * W;
      var y = Math.random() * H * 0.6;
      var hue = CODE_COLORS[count % CODE_COLORS.length];

      if (count % 7 === 0) {
        hue = (ANTI_RESALE_NAME.charCodeAt(0) * 7 + count * 13) % 360;
      }

      explodeHeartFirework(x, y, hue);
      count++;
    }, 300);
  }

  // ==================== 音频 ====================
  var audioCtx = null;
  var musicEl = null;

  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {}

    if (musicUrl && !musicEl) {
      musicEl = new Audio(musicUrl);
      musicEl.loop = true;
      musicEl.volume = 0.5;
      var playPromise = musicEl.play();
      if (playPromise) playPromise.catch(function() {});
    }
  }

  document.getElementById('musicBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    initAudio();
    if (musicEl) {
      if (musicEl.paused) { musicEl.play(); this.textContent = '🔊'; }
      else { musicEl.pause(); this.textContent = '🔇'; }
    }
  });

  // ==================== 主渲染循环 ====================
  function render() {
    ctx.clearRect(0, 0, W, H);

    var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#0a0a2e');
    bgGrad.addColorStop(0.5, '#1a1a3e');
    bgGrad.addColorStop(1, '#0d0d1a');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    stars.forEach(function(star) {
      star.twinkle += star.speed;
      var alpha = 0.3 + 0.7 * Math.abs(Math.sin(star.twinkle));
      ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      ctx.beginPath();
      ctx.arc(star.x % W, star.y % H, star.r, 0, Math.PI * 2);
      ctx.fill();
    });

    for (var i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw(ctx);
      if (particles[i].alpha <= 0) particles.splice(i, 1);
    }

    ctx.fillStyle = 'rgba(255,255,255,0.003)';
    ctx.font = '6px monospace';
    ctx.fillText(ANTI_RESALE_CODE, W - 60, H - 4);

    requestAnimationFrame(render);
  }

  // 开局第一朵
  setTimeout(function() {
    var midX = W / 2;
    var midY = H * 0.32;
    explodeFirework(midX, midY, CODE_COLORS[0]);
    revealChar(0);
    clickCount = 1;
    hintText.textContent = '已绽放 1/' + chars.length + ' 朵烟花';
  }, 800);

  render();
})();
</script>
</body>
</html>
